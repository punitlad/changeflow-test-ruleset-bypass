# Counterpart to deploy.yml: fires on the same push-to-main event, but only for merges
# actually performed by changeflow's App identity, not any merge to main. Verified against
# a real run that `github.actor` reliably reflects the App's bot login for pushes resulting
# from its own API merges (actor == triggering_actor == bot login).
#
# Placeholder for anything that should happen specifically because changeflow did the merge
# -- e.g. notifying wherever changeflow's job state doesn't already cover, writing an
# App-specific audit trail, etc. -- as distinct from deploy.yml's general "something landed
# on main" pipeline, which runs regardless of who merged it.
name: app-merge
on:
  push:
    branches: [main]
jobs:
  record:
    if: github.actor == 'my-changeflow-app[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: "Record automated onboarding merge"
        run: |
          echo "Merged by changeflow (${{ github.actor }}): ${{ github.event.head_commit.message }}"
          echo "Commit: ${{ github.sha }}"
