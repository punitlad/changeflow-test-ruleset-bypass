# The human-path pipeline. Triggered on push to main, but scoped to exclude the App's own
# merges -- those are app-merge.yml's job, not this one. The two are now mutually exclusive:
# exactly one of deploy.yml / app-merge.yml runs its job per push, based on who merged.
# Gated behind the "production" environment -- a human merge here needs a real approval
# click (or API call), since nothing auto-approves it the way changeflow does for its own.
name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    if: github.actor != 'my-changeflow-app[bot]'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: "Deploy (simulated)"
        run: |
          echo "Deploying with current teams:"
          cat teams.json
