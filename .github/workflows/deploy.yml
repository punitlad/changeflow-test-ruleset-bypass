# The pipeline changeflow is waiting on (pipeline.py: `pipeline_workflow_file`).
# Triggered on push to main, so the merge commit SHA from the PR identifies this run.
# Gated behind the "production" environment so the approval step (pipeline.py:
# approve_pending) has something to approve -- point CHANGEFLOW_APPROVER_TOKEN at a
# user who is a required reviewer on that environment (see setup.sh in this repo).
#
# Defense in depth on top of the ruleset bypass list: the bypass grants the App the
# *ability* to skip the required check, but anyone else with bypass/admin rights on main
# (e.g. a repo admin force-pushing) could also land a commit on main and trigger this same
# push event. `github.actor` is reliably the App's bot login for pushes resulting from its
# own API merges (verified against a real run: actor == triggering_actor == bot login) --
# so this guard makes sure the deploy pipeline only ever auto-runs for merges changeflow
# itself performed, not just anything that happens to land on main.
name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    if: github.actor == 'my-changeflow-app[bot]'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: "Deploy (simulated)"
        run: |
          echo "Deploying with current teams:"
          cat teams.json
