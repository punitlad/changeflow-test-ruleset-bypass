# PR-time required check -- the ruleset's required_status_checks entry. Runs for *any* PR
# into main, not scoped by author: this repo supports two ways onto main --
#   - human: open a PR, this check has to pass, then merge normally (ruleset enforces it,
#     no bypass for a human identity)
#   - the App: also opens a PR (changeflow always does, regardless of merge mode), but is on
#     the ruleset's bypass list, so it doesn't have to wait for this check to pass
# Keep this unscoped. A required status check that's skipped via job-level `if:` never posts
# a status at all, which would permanently block whichever path got excluded.
name: ci
on:
  pull_request:
    branches: [main]
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate teams.json is valid JSON
        run: python3 -m json.tool teams.json > /dev/null
