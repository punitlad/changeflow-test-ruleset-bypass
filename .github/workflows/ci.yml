# PR-time required check. This is the thing the branch ruleset requires before a merge
# can happen -- the App bypasses the requirement via the ruleset bypass list, but we still
# want the check to actually run and report, for visibility/audit on every changeflow PR.
#
# Scoped to PRs opened by the App (job-level `if:`) because this repo is a single-purpose
# automation target -- the only expected PR author is changeflow. DO NOT scope a *required*
# status check like this on a repo that also takes human PRs: a job skipped via `if:` never
# posts a status, so a human PR would wait forever on a check that never runs.
name: ci
on:
  pull_request:
    branches: [main]
jobs:
  validate:
    name: validate
    if: github.event.pull_request.user.login == 'my-changeflow-app[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate teams.json is valid JSON
        run: python3 -m json.tool teams.json > /dev/null
